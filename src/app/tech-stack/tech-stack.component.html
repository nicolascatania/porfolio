<section id="tech-stack" class="section-shell" [attr.aria-label]="'ts.aria-label' | translate">
  <div class="mx-auto w-full max-w-6xl px-5 sm:px-8">
    <app-section-heading
      index="03"
      eyebrowKey="ts.eyebrow"
      titleKey="ts.title"
      subtitleKey="ts.subtitle"
    />

    <div class="flex flex-col gap-10">
      @for (group of groups; track group.labelKey; let g = $index) {
        <div appScrollAnimate="up" [scrollAnimateDelay]="g * 90">
          <div class="group-label">
            <span>{{ group.labelKey | translate }}</span>
            <span class="group-rule" aria-hidden="true"></span>
            <span class="font-mono text-xs text-ink-faint">{{ group.items.length }}</span>
          </div>

          <ul class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
            @for (tech of group.items; track tech.id) {
              <li class="tech-tile surface-card">
                <img [src]="tech.src" alt="" aria-hidden="true" loading="lazy" width="40" height="40" />
                <span class="font-title text-sm font-semibold text-ink">{{ tech.name }}</span>
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
