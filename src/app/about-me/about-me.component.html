<section id="about-me" class="section-shell section-shell--alt" [attr.aria-label]="'about.aria-label' | translate">
  <div class="mx-auto w-full max-w-6xl px-5 sm:px-8">
    <app-section-heading
      index="06"
      eyebrowKey="about.eyebrow"
      titleKey="about.title"
    />

    <div class="grid gap-6 lg:grid-cols-5">
      <!-- Narrative -->
      <article class="surface-card lg:col-span-3 p-6 sm:p-8" appScrollAnimate="up">
        <svg viewBox="0 0 24 24" fill="currentColor" class="mb-4 h-8 w-8 text-accent opacity-25" aria-hidden="true">
          <path d="M9.5 5C6.46 5 4 7.46 4 10.5S6.46 16 9.5 16c.34 0 .67-.03 1-.09-.6 1.7-2.1 3.02-4 3.53V21c3.9-.63 7-4 7-8.5v-2C13.5 7.46 11.04 5 9.5 5zm10 0C16.46 5 14 7.46 14 10.5S16.46 16 19.5 16c.34 0 .67-.03 1-.09-.6 1.7-2.1 3.02-4 3.53V21c3.9-.63 7-4 7-8.5v-2C23.5 7.46 21.04 5 19.5 5z" />
        </svg>

        <p class="text-base leading-relaxed text-ink-muted sm:text-lg">
          {{ 'about.paragraph' | translate }}
        </p>
      </article>

      <!-- Quick facts: the logistics a recruiter filters on before they read
           anything else. -->
      <aside class="surface-card lg:col-span-2 p-6 sm:p-8" appScrollAnimate="up" [scrollAnimateDelay]="110">
        <h3 class="font-mono text-xs uppercase tracking-eyebrow text-accent">
          {{ 'about.quickFacts' | translate }}
        </h3>

        <dl class="mt-5">
          @for (fact of facts; track fact.labelKey) {
            <div class="fact-row">
              <dt class="font-mono text-[0.7rem] uppercase tracking-eyebrow text-ink-faint">
                {{ fact.labelKey | translate }}
              </dt>
              <dd class="mt-1 font-title text-sm font-semibold text-ink sm:text-base">
                {{ fact.valueKey | translate }}
              </dd>
            </div>
          }
        </dl>
      </aside>
    </div>
  </div>
</section>
